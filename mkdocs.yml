site_name: Stella Montis
site_description: Assistente de Lances para Sites de Leilão - Documentação Técnica
site_author: Grupo Stella Montis
repo_url: https://github.com/Batsy13/stella-montis
repo_name: Batsy13/stella-montis

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Instalação: instalacao.md
  - Arquitetura: arquitetura.md
  - Módulos:
    - Visão Geral: modulos/index.md
    - main.py: modulos/main.md
    - monitor_service.py: modulos/monitor_service.md
    - email_service.py: modulos/email_service.md
    - logger_config.py: modulos/logger_config.md
    - Interface Web: modulos/interface.md
  - Análise Big O: big-o.md
  - Histórico de Branches: branches.md
